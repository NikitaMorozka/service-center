plugins {
    id 'java'
}

ext {
    lombokVersion = '1.18.34'
}

allprojects {
    group = 'ru.servicecenter'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

tasks.register('prepareDistribution', Sync) {
    group = 'distribution'
    description = 'Builds portable distributive in build/distribution.'
    dependsOn(':server:bootJar', ':client:installDist')

    into(layout.buildDirectory.dir('distribution'))

    from('deploy/README-DISK.md')
    from('deploy/start-server.sh') {
        fileMode = 0755
    }
    from('deploy/start-client.sh') {
        fileMode = 0755
    }
    from('deploy/start-db.sh') {
        fileMode = 0755
    }
    from('deploy/stop-db.sh') {
        fileMode = 0755
    }
    from('deploy/docker-compose.db.yml')
    from('database/docker-init.sql')

    from('server/build/libs/service-center-server.jar') {
        into('server')
    }

    from('client/build/install/client') {
        into('client')
    }
}
